<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyBuddy | Edit Study Task</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Edit Study Task</h1>

            <p>Update your study task details.</p>

            <form action="{{ url_for('edit_task', task_id=task['id']) }}" method="POST">

                <div class="form-group">
                    <label for="subject">Subject</label>

                    <input type="text" id="subject" name="subject" value="{{ task['subject'] }}" required>
                </div>
                <div class="form-group">
                    <label for="task_date">Study Date</label>
                    <input type="date" id="task_date" name="task_date" value="{{ task['task_date'] or '' }}" required>
                </div>

                <div class="form-group">
                    <label for="topic">Topic</label>

                    <input type="text" id="topic" name="topic" value="{{ task['topic'] }}" required>
                </div>

                <div class="form-group">
                    <label for="priority">Priority</label>

                    <select id="priority" name="priority" required>

                        <option value="High" {% if task['priority']=='High' %}selected{% endif %}>
                            High
                        </option>

                        <option value="Medium" {% if task['priority']=='Medium' %}selected{% endif %}>
                            Medium
                        </option>

                        <option value="Low" {% if task['priority']=='Low' %}selected{% endif %}>
                            Low
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label for="start_time">Start Time</label>
                    <input type="time" id="start_time" name="start_time" value="{{ task['start_time'] }}" required>
                </div>

                <div class="form-group">
                    <label for="end_time">End Time</label>
                    <input type="time" id="end_time" name="end_time" value="{{ task['end_time'] }}" required>
                </div>

                <div class="form-group">
                    <label for="reminder_time">Reminder Time</label>
                    <input type="time" id="reminder_time" name="reminder_time"
                        value="{{ task['reminder_time'] or '' }}">
                </div>

                <div class="form-group">
                    <label for="plan_type">Plan Type</label>

                    <select id="plan_type" name="plan_type" required>

                        <option value="Daily" {% if task['plan_type']=='Daily' %}selected{% endif %}>
                            Daily
                        </option>

                        <option value="Weekly" {% if task['plan_type']=='Weekly' %}selected{% endif %}>
                            Weekly
                        </option>

                        <option value="Monthly" {% if task['plan_type']=='Monthly' %}selected{% endif %}>
                            Monthly
                        </option>

                    </select>
                </div>

                <button type="submit" class="auth-btn">
                    Update Task
                </button>

            </form>

            <p class="auth-link">
                <a href="{{ url_for('home') }}">Back to Dashboard</a>
            </p>

        </div>

    </div>

</body>

</html>

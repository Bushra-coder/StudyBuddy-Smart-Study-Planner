<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if note %}Edit Note{% else %}Add Note{% endif %} | StudyBuddy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>{% if note %}Edit Note{% else %}Add New Note{% endif %}</h1>

            <p>Write and save your important study information.</p>

            <form method="POST">

                <div class="form-group">
                    <label for="title">Note Title</label>
                    <input type="text" id="title" name="title" placeholder="Enter note title"
                        value="{{ note['title'] if note else '' }}" required>
                </div>

                <div class="form-group">
                    <label for="content">Note Content</label>
                    <textarea id="content" name="content" rows="7" placeholder="Write your notes here..." required
                        style="width:100%; padding:12px; border:1px solid #ddd; border-radius:7px; font-family:Arial;">{{ note['content'] if note else '' }}</textarea>
                </div>

                <button type="submit" class="auth-btn">
                    {% if note %}Update Note{% else %}Save Note{% endif %}
                </button>

            </form>

            <p class="auth-link">
                <a href="{{ url_for('notes') }}">← Back to My Notes</a>
            </p>

        </div>

    </div>

</body>

</html>
